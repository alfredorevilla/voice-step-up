name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Scan for GUIDs (tenant, subscription and client ids must not be tracked)
        run: |
          # Allowed: synthetic ids that start 00000000-0000-0000-0000- (fake authority, tests) and the two
          # role/scope ids in infra/entra.bicep. Lockfiles are skipped; -I skips binary files.
          allow='^(00000000-0000-0000-0000-[0-9a-f]{12}|6f1b7c0e-2d44-4b0a-9a53-0f6c3a1e5d11|3c9a2b58-71e0-4f6d-8b27-5d4e9c0a7b32)$'
          hits="$(git grep -nIioE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' -- . ':!*package-lock.json' ':!*packages.lock.json' ':!*yarn.lock' ':!*pnpm-lock.yaml' | awk -F: -v a="$allow" 'tolower($NF) !~ a' || true)"
          if [ -n "$hits" ]; then
            echo "GUID found in tracked files (file:line:value):"
            echo "$hits"
            exit 1
          fi
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore
      # Model tests need the fetched models; they run locally and in the container job below.
      - run: dotnet test --no-build -- --filter-not-trait "Category=Model"

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  bicep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the pinned Bicep CLI
        run: az bicep install --version v0.48.1
      - name: Build
        run: az bicep build --file infra/entra.bicep --stdout > /dev/null
      - name: Lint
        run: az bicep lint --file infra/entra.bicep

  demo:
    # The one-command offline demo with the real verifier: the image fetches and checks the models, the three services
    # must become healthy, and a real sign-in must give a token the API accepts.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Compose file is valid
        run: docker compose config --quiet
      - name: Start the demo and wait for the health checks
        run: docker compose up --build --wait --wait-timeout 600
      - name: Sign in and call the API
        run: node scripts/demo-smoke.mjs
      - name: Show the logs if it failed
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()

  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Lint the workflows with the pinned, checksum-verified actionlint
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION=1.7.7
          ACTIONLINT_SHA256=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          tmp="$(mktemp -d)"
          curl -fsSLo "${tmp}/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${tmp}/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "${tmp}/actionlint.tar.gz" -C "${tmp}" actionlint
          "${tmp}/actionlint" -shellcheck= -pyflakes= -color .github/workflows/*.yml

  e2e:
    # The browser journey against the offline stack: fake authority, API with the Fake verifier, built SPA.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: dotnet build
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7
