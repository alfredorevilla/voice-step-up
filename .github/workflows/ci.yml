name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Scan for tenant and subscription ids
        run: |
          hits="$(git grep -nIiE '(tenant|subscription)[a-z_ -]{0,20}[:=" ]+[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | grep -v '00000000-0000-0000-0000-000000000000' || true)"
          if [ -n "$hits" ]; then
            echo "tenant or subscription id found in tracked files:"
            echo "$hits" | cut -d: -f1,2
            exit 1
          fi
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  bicep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Bicep CLI
        run: az bicep install --version v0.48.1
      - name: Build
        run: az bicep build --file infra/entra.bicep --stdout > /dev/null
      - name: Lint
        run: az bicep lint --file infra/entra.bicep
