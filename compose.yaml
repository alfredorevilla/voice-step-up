# One-command offline demo: `docker compose up --build --wait`, then open http://localhost:5173.
# It needs no tenant and no models: a fake sign-in authority, the API with the Fake verifier, and the built SPA.
# Fake sign-in and the fake verifier are demo modes: they need Demo__Enabled and the Demo environment.
#
# The real speaker model runs under the `real` profile (fetches about 450 MB of models at build time):
#   docker compose --profile real up --build --wait api-real
# Ports are bound to 127.0.0.1 only.
services:
  authority:
    build:
      context: .
      target: authority
    image: voice-step-up-authority
    ports:
      - "127.0.0.1:5100:5100"
    environment:
      ASPNETCORE_ENVIRONMENT: Demo
      # The issuer the browser sees. The API reaches this service as http://authority:5100.
      FakeAuthority__PublicUrl: http://localhost:5100
    healthcheck:
      # The runtime image has no curl: a plain TCP request from bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5100 && printf 'GET /.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      target: api-demo
    image: voice-step-up-api-demo
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Demo
      Demo__Enabled: "true"
      Verifier__Mode: Fake
      Auth__Fake__MetadataAddress: http://authority:5100/.well-known/openid-configuration
    volumes:
      - stepup-demo-data:/data
    depends_on:
      authority:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: ./web
    image: voice-step-up-web
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # The API with the real in-process verifier (sherpa-onnx + WeSpeaker). No sign-in authority: use it for the
  # model health check and the model tests, or point it at a real tenant (see README).
  api-real:
    profiles: ["real"]
    build:
      context: .
    image: voice-step-up-api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Demo
      Demo__Enabled: "true"
      Verifier__Mode: Sherpa
    volumes:
      - stepup-data:/data
    restart: unless-stopped

volumes:
  stepup-demo-data:
  stepup-data:
