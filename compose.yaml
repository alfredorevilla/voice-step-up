# One-command offline demo: `docker compose up --build --wait`, then open http://localhost:5173.
# It needs no tenant: a fake sign-in authority, the API with the real speaker verifier (sherpa-onnx + WeSpeaker, the
# image fetches about 450 MB of models at build time, checked against models/models.lock), and the built SPA.
# The Fake verifier is not offered here: it ignores speech and reads a stand-in payload, so a microphone cannot use it.
# Fake sign-in is a demo mode: it needs Demo__Enabled and the Demo environment. Ports are bound to 127.0.0.1 only.
services:
  authority:
    build:
      context: .
      target: authority
    image: voice-step-up-authority
    ports:
      - "127.0.0.1:5100:5100"
    environment:
      ASPNETCORE_ENVIRONMENT: Demo
      Demo__Enabled: "true"
      # The issuer the browser sees. The API reaches this service as http://authority:5100.
      FakeAuthority__PublicUrl: http://localhost:5100
    healthcheck:
      # The runtime image has no curl: a plain TCP request from bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5100 && printf 'GET /.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
    image: voice-step-up-api
    ports:
      - "127.0.0.1:5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Demo
      Demo__Enabled: "true"
      Verifier__Mode: Sherpa
      Auth__Fake__MetadataAddress: http://authority:5100/.well-known/openid-configuration
    volumes:
      - stepup-data:/data
    depends_on:
      authority:
        condition: service_healthy
    # The image carries its own HEALTHCHECK (GET /healthz on 8080).
    restart: unless-stopped

  web:
    build:
      context: ./web
    image: voice-step-up-web
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  stepup-data:
