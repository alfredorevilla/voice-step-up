# Model lock. Read by scripts/fetch-models.sh and by the verifier at startup.
# Fields: scope kind sha256 path [url]
#   scope: runtime (needed to run the service) or test (needed only by Category=Model tests)
#   download: fetch the url to models/<path>; a .tar.bz2 is checked, extracted into models/<path without the suffix>
#             (first path component stripped) and then removed. The sha256 is of the downloaded file.
#   verify:   sha256 of a file that must exist under models/ after extraction. The verifier checks these at startup.
# Where the owner publishes a checksum it is noted; otherwise the sha256 was recorded at the first verified download (2026-10-21).
# Licences: wespeaker model CC BY 4.0 (VoxCeleb), Whisper base.en MIT (OpenAI), Piper LibriTTS-R voices CC BY 4.0. See NOTICE.

